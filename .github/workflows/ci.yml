name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format (Ruff)
        run: ruff format --check .
      - name: Types (mypy)
        run: mypy
      - name: Architecture contracts (import-linter)
        run: lint-imports
      - name: Tests with coverage gate
        # Set the repository variable BACKEND_COVERAGE_MIN to change the floor (default 80).
        run: pytest --cov-fail-under=${{ vars.BACKEND_COVERAGE_MIN || 80 }}

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Types (tsc)
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build
        run: npm run build

  contract:
    name: API contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Export OpenAPI schema from the backend
        working-directory: backend
        run: |
          pip install -e .
          python scripts/export_openapi.py > ../contracts/openapi.json
      - name: Committed schema matches the backend
        run: git diff --exit-code -- contracts/openapi.json
      - name: Regenerate typed client
        working-directory: frontend
        run: |
          npm ci
          npm run api:generate
      - name: Committed client types match the schema
        run: git diff --exit-code -- frontend/src/shared/api/schema.d.ts

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e .
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright smoke tests
        working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
