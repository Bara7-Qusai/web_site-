name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format (Ruff)
        run: ruff format --check .
      - name: Types (mypy)
        run: mypy
      - name: Architecture contracts (import-linter)
        run: lint-imports
      - name: Tests with coverage gate
        # Set the repository variable BACKEND_COVERAGE_MIN to change the floor (default 80).
        run: pytest --cov-fail-under=${{ vars.BACKEND_COVERAGE_MIN || 80 }}
